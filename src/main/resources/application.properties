# Spring Boot
server.port=${PORT:8081}
spring.application.name=compilador-traductor

# CORS: en Render configura FRONTEND_ORIGINS con el dominio exacto de Vercel.
# Ejemplo: https://tu-proyecto.vercel.app
app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# Cloud Translator API - configuracion academica directa.
translator.api.provider=google

# Google Cloud Translation
translator.api.key=${GOOGLE_API_KEY}

# Opcional: compatibilidad si vuelves a usar Azure Translator.
translator.api.region=${TRANSLATOR_API_REGION:southcentralus}
translator.api.endpoint=${TRANSLATOR_API_ENDPOINT:https://api.cognitive.microsofttranslator.com}

# Evita que llamadas externas de traduccion queden colgadas demasiado tiempo.
translator.api.timeout-seconds=${TRANSLATOR_API_TIMEOUT_SECONDS:8}
